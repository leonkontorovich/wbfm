## gui_only.yaml

# Made by Charles Fieseler
#Please see AUTHORS for contributors.

# update:  conda env update -f gui_only.yaml

channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pandas
  - pytables
  - openpyxl
  - pyqt
  - pytest
  - pip:
    - opencv-python-headless
    - statsmodels
    - ppca
    - sacred
    - ruamel.yaml
    - networkx
    - backports.cached_property
    - methodtools
    - seaborn
    - loguru
    - ndtiff
    - ndstorage
    - pynwb
    - ndx_multichannel_volume
    - scikit-image
    - lmfit
    - zarr
    - matplotlib
    - scikit-learn
    - napari[all]==0.8.*  # tested GUI version; newer napari drops the PyQt5 backend that wbfm/gui uses directly
    - plotly
